<!doctype html>
<html>
<head>
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SVG Rollovers | Jose Bolanos 2025</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
      background-image: url(https://preview.redd.it/1oh3prd5lsr71.jpg?auto=webp&s=5bbd5ea048f1e48b0af1f2ea52d0c2df26e27dbe);
      background-size: cover;
      background-repeat: no-repeat;
    }

    .wrapper {
      width: 1366px;
      margin: auto;
    }

    header {
      width: auto;
      margin: auto;
      height: auto;
    }

   
    .bg {
      transition: opacity 0.3s ease;
    }

    .shape {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #Tin_star:hover .shape,
    #Tin_circle:hover .shape,
    #Tin_Square:hover .shape,
    #Tin_pentagon:hover .shape {
      opacity: 1;
    }

    #Tin_star:hover .bg,
    #Tin_circle:hover .bg,
    #Tin_Square:hover .bg,
    #Tin_pentagon:hover .bg {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <img src="Banner-01-01.png" alt="Banner" width="1500" height="500">
    </header>

    <svg xmlns="http://www.w3.org/2000/svg" width="483.78" height="482.97" viewBox="0 0 483.78 482.97">

     
      <g id="Tin_pentagon">
        <circle class="bg" cx="370.4" cy="366.34" r="113.38" fill="#efb75e"/>
        <polygon class="shape" points="408.59 423.01 325.23 419.33 302.97 338.92 372.56 292.9 437.84 344.87 408.59 423.01"
          fill="#efb75e" stroke="#9e5f04" stroke-miterlimit="10" stroke-width="4"/>
      </g>

     
      <g id="Tin_circle">
        <circle class="bg" cx="112.99" cy="369.99" r="112.99" fill="#efb75e"/>
        <circle class="shape" cx="112.99" cy="369.82" r="85.04" fill="#efb75e" stroke="#9e5f04" stroke-miterlimit="10" stroke-width="4"/>
      </g>

     
      <g id="Tin_Square">
        <circle class="bg" cx="374.8" cy="106.66" r="106.66" fill="#efb75e"/>
        <rect class="shape" x="315.45" y="49.85" width="118.7" height="103.21"
          fill="#efb75e" stroke="#9e5f04" stroke-miterlimit="10" stroke-width="4"/>
      </g>

      
      <g id="Tin_star">
        <circle class="bg" cx="114.83" cy="112.43" r="103.01" fill="#efb75e"/>
        <polygon class="shape"
          points="114.83 38.48 122.95 86.25 155.6 50.45 136.6 95.02 183.42 82.56 143.34 109.78 189.47 124.61 141.03 125.85 171.82 163.26 130.4 138.11 136.08 186.23 114.83 142.68 93.59 186.23 99.26 138.11 57.85 163.26 88.63 125.85 40.2 124.61 86.33 109.78 46.25 82.56 93.07 95.02 74.07 50.45 106.72 86.25 114.83 38.48"
          fill="#efb75e" stroke="#9e5f04" stroke-miterlimit="10" stroke-width="3"/>
      </g>

    </svg>
  </div>
</body>
</html>
